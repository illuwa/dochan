[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dochan"
version = "1.4.0"
description = "dochan — HWP/HWPX 문서 파서, AI/LLM 최적 Markdown 변환"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "illuwa" }]
readme = "README.md"
keywords = ["hwp", "hwpx", "parser", "korean", "document", "markdown", "ai", "llm", "hancom"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "olefile>=0.47",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff==0.16.2"]
ocr = [
    "pytesseract>=0.3; python_version >= '3.10'",
    "Pillow>=12.3; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/illuwa/dochan"
Repository = "https://github.com/illuwa/dochan"
Issues = "https://github.com/illuwa/dochan/issues"
Documentation = "https://github.com/illuwa/dochan#readme"
Changelog = "https://github.com/illuwa/dochan/blob/main/CHANGELOG.md"

[project.scripts]
dochan = "dochan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dochan", "dochan.*"]
namespaces = false

[tool.setuptools.package-data]
dochan = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
